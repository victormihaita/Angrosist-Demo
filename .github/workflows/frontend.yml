# Frontend CI/CD (BUILD_PLAN M1 1.3, CLAUDE.md §10 — independently deployable).
#
# Two phases:
#   1. CI (always-on): install, lint, type-check + build. NO GCP/Firebase needed.
#   2. DEPLOY (DORMANT by default): deploy to Firebase Hosting. Triggers on
#      workflow_dispatch only, AND guarded by vars.DEPLOY_ENABLED == 'true'.
#
# Auth uses Workload Identity Federation / OIDC (no JSON keys). Required GitHub
# config (set when provisioning, never hardcoded):
#   Variables : DEPLOY_ENABLED, FIREBASE_PROJECT_ID, VITE_API_URL
#   Secrets   : GCP_WIF_PROVIDER, GCP_DEPLOYER_SA

name: frontend

on:
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  # ---------------------------------------------------------------------------
  # CI — always runs, no GCP needed.
  # ---------------------------------------------------------------------------
  ci:
    name: lint / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (app + widget)
        # VITE_API_URL is non-secret config; CI uses a placeholder so the build
        # compiles. The real value is injected at deploy time only.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.example.com' }}
        run: npm run build:all

      - name: npm audit (dependency scanning)
        run: npm audit --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # DEPLOY — DORMANT BY DEFAULT (workflow_dispatch only + DEPLOY_ENABLED guard).
  #
  # ENABLE PUSH-TRIGGERED DEPLOYS LATER:
  #   1. Provision Firebase Hosting + Workload Identity.
  #   2. Set repo variable DEPLOY_ENABLED=true and FIREBASE_PROJECT_ID/VITE_API_URL.
  #   3. To auto-deploy on merge to develop, change the `if:` to also accept
  #      github.event_name == 'push' (keep the DEPLOY_ENABLED guard on each step).
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy → Firebase Hosting
    needs: [ci]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (OIDC)
    steps:
      - name: Guard — deploy disabled until hosting is ready
        if: vars.DEPLOY_ENABLED != 'true'
        run: |
          echo "DEPLOY_ENABLED is not 'true' — frontend deploy is dormant. Nothing to do."

      - uses: actions/checkout@v4
        if: vars.DEPLOY_ENABLED == 'true'

      - uses: actions/setup-node@v4
        if: vars.DEPLOY_ENABLED == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build:all

      - name: Authenticate to GCP (Workload Identity, no JSON keys)
        if: vars.DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Deploy to Firebase Hosting
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          npx firebase-tools@latest deploy --only hosting \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
